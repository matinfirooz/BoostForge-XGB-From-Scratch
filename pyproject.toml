[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boostforge-scratch"
version = "0.1.0"
description = "XGBoost-style Gradient Boosted Decision Trees from scratch using NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Matin Firoozbakht"}
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "scikit-learn>=1.3"
]

[tool.setuptools.packages.find]
include = ["boostforge*"]
